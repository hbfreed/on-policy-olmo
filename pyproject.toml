[project]
name = "on-policy-olmo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "liger-kernel>=0.6.4",
    "torch>=2.11",
    "torchao>=0.15.0",
    "transformers>=4.44,<5",
    "datasets>=4.5,<5",
    "huggingface-hub>=0.20.0",
    "wandb>=0.15.0",
    "flash-attn>=2.8.3",
    "hf-transfer>=0.1.9",
    "vllm>=0.23",
    "lm-eval[ifeval,vllm]>=0.4.0",
    "bitsandbytes>=0.49.1",
    "cut-cross-entropy>=0.1.0",
    "flashoptim>=0.1.2",
    "immutabledict>=4.3.1",
    "sortedcontainers>=2.4.0",
    "accelerate>=1.13.0",
    "muon-optimizer>=0.1.0",
]

[tool.uv]
# torch 2.11 is CUDA 13.0, but uv floats the build-side CUDA components to newer minors
# (nvcc->13.2, cccl->13.3), so their headers reject each other. Pin the compiler+header
# trio to 13.0 so flash-attn builds against a toolkit consistent with torch's runtime.
constraint-dependencies = [
    "nvidia-cuda-nvcc==13.0.*",
    "nvidia-cuda-cccl==13.0.*",
    "nvidia-cuda-crt==13.0.*",
    "nvidia-nvvm==13.0.*",
]
# Build flash-attn in the project env (NOT an isolated build env) so the CUDA-13.0
# constraints above apply to the headers/nvcc the compiler actually sees. An isolated
# build re-resolves torch's CUDA deps and floats cccl back to 13.3 -> header mismatch.
no-build-isolation-package = ["flash-attn"]

[tool.uv.sources]
# flash-attn has no torch-2.11 wheel upstream, so we built it from source (sm_80, cu13.0)
# and vendored the wheel. uv installs this prebuilt binary instead of recompiling on every
# sync. To rebuild (e.g. new torch): see the build recipe in memory / wheels/ is gitignored.
flash-attn = { path = "wheels/flash_attn-2.8.3-cp312-cp312-linux_x86_64.whl" }
